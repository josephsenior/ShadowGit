name: Feature request
description: Suggest an improvement to ShadowGit
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please check existing issues first. For security-sensitive reports, use private vulnerability reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternatives have you tried?
