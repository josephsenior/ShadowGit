[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadowgit"
version = "0.1.0"
description = "Git-object-backed snapshots and conservative restores for any directory"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Youssef Mejdi" }]
keywords = ["backup", "checkpoint", "git", "rollback", "snapshot"]
dependencies = [
  "pathspec>=1.1.1,<2",
  "pygit2>=1.20.0,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/josephsenior/shadowgit"
Documentation = "https://github.com/josephsenior/shadowgit#readme"
Issues = "https://github.com/josephsenior/shadowgit/issues"
Source = "https://github.com/josephsenior/shadowgit"

[project.scripts]
shadowgit = "shadowgit.cli:main"

[dependency-groups]
test = ["pytest>=9.1.1"]

[project.optional-dependencies]
test = [
  "build>=1.4.0",
  "pytest>=9.1.1",
  "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shadowgit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
